<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KodeKloud Transcript Copier</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span>KodeKloud Transcript Copier</span>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button id="themeLight" type="button" title="Light theme" aria-label="Light theme" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <button id="themeDark" type="button" title="Dark theme" aria-label="Dark theme" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <p id="message" class="message" hidden></p>
      <button id="retry" type="button" hidden>Retry</button>

      <section id="content" hidden>
        <h1 id="title"></h1>

        <label id="videoRow" class="row" hidden>
          <span>Video</span>
          <select id="videoSelect"></select>
        </label>

        <label class="row">
          <span>Language</span>
          <select id="langSelect"></select>
        </label>

        <label class="check">
          <input type="checkbox" id="timestamps" />
          <span>Show timestamps</span>
        </label>

        <textarea id="preview" readonly spellcheck="false"></textarea>
        <p id="stats" class="stats"></p>

        <div class="actions">
          <button id="copy" type="button" disabled>📋 Copy</button>
          <button id="download" type="button" disabled>⬇ Download .txt</button>
        </div>
      </section>
    </main>

    <script src="vtt.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
